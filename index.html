<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>Nina on God's Path 🕊️🤗</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/carousel.css">
</head>
<body>
  <main class="carousel" aria-roledescription="carousel" aria-label="Photos of Nina">
    <div class="stage" id="stage">
      <img class="slide is-active" id="slide-a" alt="" decoding="async">
      <img class="slide" id="slide-b" alt="" decoding="async">
    </div>

    <button type="button" class="nav nav-prev" id="prev" aria-label="Previous photo">
      <span aria-hidden="true">&#8249;</span>
    </button>
    <button type="button" class="nav nav-next" id="next" aria-label="Next photo">
      <span aria-hidden="true">&#8250;</span>
    </button>

    <div class="counter" id="counter" aria-live="polite"></div>
  </main>

  <audio id="music" src="assets/music/amazing-grace.mp3" loop preload="auto"></audio>

  <button type="button" class="music-toggle is-prompt" id="music-toggle" aria-pressed="false">
    Tap to play music
  </button>

  <footer class="credit" id="caption" aria-live="polite"></footer>

  <noscript>
    <p class="noscript">This photo carousel needs JavaScript. Please enable it to view the photos of Nina.</p>
  </noscript>

  <script src="js/carousel.js"></script>
</body>
</html>
